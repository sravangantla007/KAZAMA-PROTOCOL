[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api/index.py"

[project]
name = "digital-dark-spot"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "trafilatura>=1.9",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "tldextract>=5.1",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "chardet>=5.2",
    "tavily-python>=0.3.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "reportlab>=4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: marks tests as requiring live network/LLM (deselect with -m 'not live')"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
